name: Capstan
packages:
  Alamofire:
    path: Vendor/Alamofire
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework-Static
    from: 6.17.9
options:
  bundleIdPrefix: com.capstan
  deploymentTarget:
    iOS: '17.0'
    watchOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Capstan:
    type: application
    platform: iOS
    sources:
    - path: Capstan
    dependencies:
    - target: CapstanWatch
      embed: true
    - package: Alamofire
    - package: AppsFlyerLib
      product: AppsFlyerLib-Static
    resources:
    - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.capstan.grid
        PRODUCT_NAME: Capstan
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_CFBundleDisplayName: Chickostan
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Support/Capstan-Info.plist
  CapstanWatch:
    type: application
    platform: watchOS
    sources:
    - path: Capstan/ReviewLaunch.swift
    - path: Capstan/DesignTokens.swift
    - path: CapstanWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.capstan.grid.watchkitapp
        PRODUCT_NAME: CapstanWatch
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Chickostan
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.capstan.grid
        WATCHOS_DEPLOYMENT_TARGET: '26.0'
        TARGETED_DEVICE_FAMILY: '4'
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  CapstanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: CapstanTests
    dependencies:
    - target: Capstan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.capstan.grid.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '6.2'
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Capstan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Capstan
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  Capstan:
    build:
      targets:
        Capstan: all
        CapstanTests:
        - test
    test:
      targets:
      - CapstanTests
  CapstanWatch:
    build:
      targets:
        CapstanWatch: all
